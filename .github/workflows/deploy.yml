name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one deploy at a time; a second push while one is running waits its turn
# rather than racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    # Windows runners default `run:` steps to PowerShell; these scripts are
    # written in bash. Plain `shell: bash` resolves via PATH, and on many
    # Windows boxes C:\Windows\System32\bash.exe — a legacy WSL launcher
    # shim — comes first and gets picked instead of Git for Windows' bash,
    # so it's pinned to the real one explicitly. The runner's custom-shell
    # parser splits this string on the first space with no quoting support,
    # so "C:\Program Files\..." breaks it — the 8.3 short name (no space)
    # sidesteps that. --noprofile --norc -eo pipefail matches what
    # `shell: bash` uses by default elsewhere.
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # data/ and public/uploads/ are gitignored, real content that lives
          # only on this machine — don't let `git clean` wipe them on checkout.
          clean: false

      - name: Show run context
        # Docker Desktop's named pipe is only reachable by whoever is in the
        # docker-users group (or an interactive session that started it) —
        # if the runner service logs on as a different account, docker
        # commands fail with "permission denied" regardless of what the
        # workflow does. This makes that account visible in the log.
        run: |
          echo "Running as: $(whoami)"
          docker version || true

      - name: Verify .env is present
        run: |
          echo "Working directory: $(pwd)"
          ls -la
          if [ ! -f .env ]; then
            echo "::error::.env is missing in the directory above. Create it once from .env.example (see README) — it is never checked into git and CI never writes it. If it's on disk somewhere else, it needs to be in this exact folder (the runner's checkout of this repo), not wherever it was manually placed." >&2
            exit 1
          fi

      - name: Build and restart
        run: docker compose up -d --build

      - name: Back up database before migrating
        # The one moment schema changes actually happen. Keep the last 10
        # pre-deploy snapshots — cheap insurance against a bad migration.
        run: |
          mkdir -p backups
          if [ -f data/greendal.db ]; then
            cp data/greendal.db "backups/pre-deploy-$(date +%Y%m%d-%H%M%S).db"
            ls -1t backups/pre-deploy-*.db | tail -n +11 | xargs -r rm --
          fi

      - name: Apply migrations
        # Runs whatever SQL is checked into drizzle/ — no live schema diffing,
        # no prompts, no guessing. New columns/tables go through `npm run
        # db:generate` locally (review the SQL, commit it); this just
        # replays whatever hasn't been applied yet, in order.
        run: docker compose exec -T app npx drizzle-kit migrate

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 3
          done
          echo "::error::App did not respond on :3000 after restart" >&2
          docker compose logs --tail=100 app
          exit 1

      - name: Clean up old images
        run: docker image prune -f
